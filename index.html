<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Last Mile Endurance · Private endurance coaching</title>
    <meta name="description" content="Thoughtful, one-to-one coaching for runners and triathletes, from 800m to Ironman." />
    <meta property="og:title" content="Last Mile Endurance" />
    <meta property="og:description" content="Thoughtful, one-to-one coaching for runners and triathletes, from 800m to Ironman." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <!-- Form definitions for Netlify Forms. Keep field names in sync with src/pages/Contact.tsx and Resources.tsx. -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="subject" /><input name="name" /><input name="email" /><input name="discipline" />
      <input name="goal" /><input name="coach" /><input name="consultation" />
      <textarea name="message"></textarea><input name="bot-field" />
    </form>
    <form name="newsletter" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="subject" /><input name="email" /><input name="bot-field" />
    </form>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
